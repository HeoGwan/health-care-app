<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>루틴 케어 - 건강한 습관을 시작하세요</title>
    <script>
      if (window.location.pathname.startsWith('/exercise')) {
        document.documentElement.classList.add('exercise-route');
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',
          sans-serif;
        background-color: #f5f5f5;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      html.exercise-route #root {
        max-width: none;
        min-height: 100vh;
        height: auto;
        margin: 0;
        overflow: visible;
        box-shadow: none;
        background-color: white;
      }
      /* 모바일 환경 시뮬레이션을 위한 스타일 */
      @media (min-width: 768px) {
        #root {
          max-width: 375px;
          margin: 0 auto;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          background-color: white;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.jsx"></script>
  </body>
</html>
